<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🛒 ShopEasy</h1>

    <div class="header-actions">
        <input type="search" id="search-input" placeholder="Search products...">
        <button type="button" id="search-button">🔍 Search</button>
        <a href="cart.html">🛒 Cart</a>
        <a href="login.html">Login</a>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<section>
    <h2 class="page-title">Checkout</h2>

    <div class="checkout-container">

        <div class="customer-details">
            <h3>Customer Details</h3>

            <form id="checkout-form">

                <label for="checkout-name">Full Name</label>
                <input type="text" id="checkout-name" required>

                <label for="checkout-email">Email</label>
                <input type="email" id="checkout-email" required>

                <label for="checkout-phone">Phone</label>
                <input type="tel" id="checkout-phone" required>

                <label for="checkout-address">Address</label>
                <textarea id="checkout-address" required></textarea>

                <label for="checkout-city">City</label>
                <input type="text" id="checkout-city" required>

                <label for="checkout-zip">ZIP Code</label>
                <input type="text" id="checkout-zip" required>

                <label for="checkout-country">Country</label>
                <select id="checkout-country">
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                </select>

                <h3>Payment Method</h3>

                <select id="payment-method" required>
                    <option value="">Select Payment Method</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Debit Card">Debit Card</option>
                    <option value="Net Banking">Net Banking</option>
                    <option value="UPI">UPI</option>
                </select>

                <button type="submit" class="main-button">
                    Place Order
                </button>

            </form>
        </div>

        <div class="checkout-summary">
            <h3>Your Order</h3>

            <div id="checkout-items"></div>

            <p>Subtotal: ₹<span id="checkout-subtotal">0</span></p>
            <p>Shipping: ₹<span id="checkout-shipping">0</span></p>

            <hr>

            <p>
                <strong>Total: ₹<span id="checkout-total">0</span></strong>
            </p>
        </div>

    </div>
</section>

<footer>
    <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>

    <p>
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a> |
        <a href="login.html">Login</a> |
        <a href="cart.html">Cart</a>
    </p>
</footer>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🛒 ShopEasy</h1>

    <div class="header-actions">
        <input type="search" id="search-input" placeholder="Search products...">
        <button type="button" id="search-button">🔍 Search</button>
        <a href="cart.html">🛒 Cart</a>
        <a href="login.html">Login</a>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<section>
    <h2 class="page-title">Shopping Cart</h2>

    <div class="cart-container">

        <div class="cart-items" id="cart-items"></div>

        <div class="order-summary">
            <h3>Order Summary</h3>

            <p>Subtotal: ₹<span id="subtotal">0</span></p>
            <p>Shipping: ₹<span id="shipping">0</span></p>

            <hr>

            <p>
                <strong>Total: ₹<span id="total">0</span></strong>
            </p>

            <a href="checkout.html" class="main-button">
                Proceed to Checkout
            </a>
        </div>

    </div>
</section>

<section>
    <div class="continue-shopping">
        <a href="products.html" class="main-button">Continue Shopping</a>
    </div>
</section>

<footer>
    <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>

    <p>
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a> |
        <a href="login.html">Login</a> |
        <a href="cart.html">Cart</a>
    </p>
</footer>

<script src="app.js"></script>
</body>
</html>
